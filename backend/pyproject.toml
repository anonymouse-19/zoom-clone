# Tool configuration for the backend (Ruff linter/formatter and pytest).
# Dependencies live in requirements*.txt, not here, to keep install steps simple.

[tool.ruff]
line-length = 100
target-version = "py311"
# Migration files are generated by Alembic and reviewed by hand, not re-styled.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes (real bugs), I = import sorting,
# B = bugbear (common Python pitfalls), UP = modern syntax, N = naming conventions.
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
# Black-compatible formatting, as required by the spec.
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests write `from app.main import ...` without installing the app as a package.
pythonpath = ["."]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) shares its name with the alembic package;
# without this, Ruff would sort `import alembic` as if it were our own code.
known-third-party = ["alembic"]
